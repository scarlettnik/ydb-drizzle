name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:
    inputs:
      run_live:
        description: Run live YDB integration tests
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x
          - 22.x
          - 24.x

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: npm ci

      - name: Install documentation dependencies
        run: npm run docs:setup

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Build docs
        run: npm run docs:build

  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit

  package:
    name: Package dry run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify package contents
        run: npm run pack:dry-run

  live:
    name: Live YDB integration tests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YDB_CONNECTION_STRING: ${{ secrets.YDB_CONNECTION_STRING }}
      YDB_TEST_TABLE: ${{ vars.YDB_TEST_TABLE || 'adapter_test_users' }}
      YDB_POSTS_TEST_TABLE: ${{ vars.YDB_POSTS_TEST_TABLE || 'adapter_test_posts' }}
      YDB_TYPES_TEST_TABLE: ${{ vars.YDB_TYPES_TEST_TABLE || 'adapter_test_column_types' }}
      YDB_TEST_KEEP_DATA: "0"
      YDB_TEST_VERBOSE: "0"
      YDB_TEST_REQUIRE_LIVE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require YDB connection string
        run: test -n "$YDB_CONNECTION_STRING"

      - name: Live tests
        run: npm run test:live
