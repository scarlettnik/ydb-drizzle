name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run npm publish in dry-run mode
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Require YDB connection string
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: test -n "$YDB_CONNECTION_STRING"
        env:
          YDB_CONNECTION_STRING: ${{ secrets.YDB_CONNECTION_STRING }}

      - name: Live tests
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: npm run test:live
        env:
          YDB_CONNECTION_STRING: ${{ secrets.YDB_CONNECTION_STRING }}
          YDB_TEST_TABLE: ${{ vars.YDB_TEST_TABLE || 'adapter_test_users' }}
          YDB_POSTS_TEST_TABLE: ${{ vars.YDB_POSTS_TEST_TABLE || 'adapter_test_posts' }}
          YDB_TYPES_TEST_TABLE: ${{ vars.YDB_TYPES_TEST_TABLE || 'adapter_test_column_types' }}
          YDB_TEST_KEEP_DATA: "0"
          YDB_TEST_VERBOSE: "0"
          YDB_TEST_REQUIRE_LIVE: "1"

      - name: Publish dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm publish --dry-run --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
